<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XyloKerf Support</title>
  <style>
    :root { color-scheme: light; --green:#12312a; --gold:#d9b36c; --cream:#f7f3ea; --muted:#49655f; --orange:#ef6b35; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--cream); color:var(--green); }
    main { max-width:760px; margin:0 auto; padding:48px 22px; }
    .card { background:white; border-radius:24px; padding:28px; box-shadow:0 18px 50px rgba(18,49,42,.10); }
    h1 { font-size:42px; margin:0 0 8px; letter-spacing:-.04em; }
    p { color:var(--muted); line-height:1.6; font-size:17px; }
    a { color:var(--green); font-weight:700; }
    .links { display:grid; gap:14px; margin-top:24px; }
    .link { display:block; padding:16px 18px; border-radius:16px; background:var(--cream); text-decoration:none; }
    .pill { display:inline-flex; gap:8px; align-items:center; background:rgba(217,179,108,.35); border-radius:999px; padding:8px 12px; font-weight:800; color:var(--green); }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <span class="pill">XyloKerf</span>
      <h1>Support and policies</h1>
      <p>XyloKerf is an iPhone cut planning app for materials, parts, kerf-aware layouts, shop checklists, and PDF/CSV exports.</p>
      <div class="links">
        <a class="link" href="support.html">Support page →</a>
        <a class="link" href="mailto:team@tsmdigital.com?subject=XyloKerf%20Support">Email support →</a>
        <a class="link" href="privacy.html">Privacy policy →</a>
      </div>
    </section>
  </main>
</body>
</html>
